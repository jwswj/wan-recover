apiVersion: apps/v1
kind: Deployment
metadata:
  name: wan-recover
  namespace: wan-recover
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wan-recover
  template:
    metadata:
      labels:
        app: wan-recover
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wan-recover
          image: wan-recover:local
          ports:
            - name: http
              containerPort: 8080
              hostPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/wan-recover
              readOnly: true
            - name: secrets
              mountPath: /run/wan-recover
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wan-recover-data
        - name: config
          configMap:
            name: wan-recover-config
        - name: secrets
          secret:
            secretName: wan-recover-secrets
            defaultMode: 0440
